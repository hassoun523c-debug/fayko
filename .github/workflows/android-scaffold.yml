name: Prepare Android platform files

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-scaffold.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fayko-android-scaffold
  cancel-in-progress: false

jobs:
  scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate or refresh Android platform files
        run: |
          flutter create --platforms=android --org com.fayko --project-name fayko .

      - name: Commit Android platform files and Gradle wrapper
        run: |
          git add android/
          for file in android/gradlew android/gradlew.bat android/gradle/wrapper/gradle-wrapper.jar; do
            if [ -f "$file" ]; then git add -f "$file"; fi
          done
          if git diff --cached --quiet; then
            echo "No Android platform file changes to commit."
            exit 0
          fi
          if git diff --cached --quiet; then
            echo "No generated Android files to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add generated Android platform scaffolding"
          git restore .
          git clean -fd
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
