name: Build Vemblix Android preview APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "lib/**"
      - "pubspec.yaml"
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vemblix-android-apk
  cancel-in-progress: true

jobs:
  build:
    name: Build preview APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart source
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests (legacy UI tests may need refresh)
        run: flutter test
        continue-on-error: true

      - name: Build preview APK
        run: flutter build apk --release --split-per-abi --dart-define=VEMBLIX_PREVIEW_MODE=true

      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: Vemblix-Android-Preview-APKs
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
