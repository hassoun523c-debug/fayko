name: Build Fayko Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "pubspec.yaml"
      - "analysis_options.yaml"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read

concurrency:
  group: fayko-android-build
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create --platforms=android --project-name=fayko .

      - name: Install dependencies
        run: flutter pub get

      - name: Format Dart source
        run: dart format --output=none --set-exit-if-changed lib

      - name: Analyze Dart source
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fayko-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
