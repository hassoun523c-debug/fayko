name: Validate Fayko API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

concurrency:
  group: fayko-backend-validation
  cancel-in-progress: true

jobs:
  test-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fayko_test
          POSTGRES_PASSWORD: test-only-password-2026
          POSTGRES_DB: fayko_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fayko_test -d fayko_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://fayko_test:test-only-password-2026@127.0.0.1:5432/fayko_test
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check JavaScript syntax
        run: find src test -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run unit and PostgreSQL integration tests
        run: npm test
