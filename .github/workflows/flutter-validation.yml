name: Validate Fayko Flutter project

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"
      - "analysis_options.yaml"
      - "android/**"
      - ".github/workflows/flutter-validation.yml"

permissions:
  contents: read

concurrency:
  group: fayko-flutter-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Validate Android manifest and network permission
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          manifest_path = "android/app/src/main/AndroidManifest.xml"
          root = ET.parse(manifest_path).getroot()
          android_name = "{http://schemas.android.com/apk/res/android}name"
          permissions = {
              element.attrib.get(android_name)
              for element in root.findall("uses-permission")
          }
          assert "android.permission.INTERNET" in permissions, (
              "Android release manifest must declare INTERNET permission."
          )
          print("Android manifest XML valid; INTERNET permission is present.")
          PY

      - name: Format Dart source
        run: dart format lib test

      - name: Analyze Dart source
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test
